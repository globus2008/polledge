[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polledge"
version = "0.1.0"
description = "Election betting analysis: poll-based model vs. bookmaker odds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pandas>=2.1",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
dev = ["pytest>=8", "streamlit>=1.40"]

[project.scripts]
polledge = "polledge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polledge = ["locales/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
