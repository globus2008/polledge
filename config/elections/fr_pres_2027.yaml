# Francouzské prezidentské volby 2027 (1. kolo 18. 4. 2027, 2. kolo o dva týdny později)
id: fr_pres_2027
name: "Francie – prezidentské volby 2027"
type: two_round
election_date: 2027-04-18
wiki_page: "Opinion polling for the 2027 French presidential election"
default_sample_size: 1000

# Kandidáti: ID -> jméno a aliasy, jak se objevují v hlavičkách tabulek.
# Příjmení (jméno bez prvního slova) se přidává jako alias automaticky.
# Kandidáti, kteří tu nejsou, se sečtou do "Ostatní".
candidates:
  LE_PEN: {name: "Marine Le Pen"}
  BARDELLA: {name: "Jordan Bardella"}
  PHILIPPE: {name: "Édouard Philippe"}
  ATTAL: {name: "Gabriel Attal"}
  MELENCHON: {name: "Jean-Luc Mélenchon"}
  GLUCKSMANN: {name: "Raphaël Glucksmann"}
  RETAILLEAU: {name: "Bruno Retailleau"}
  ZEMMOUR: {name: "Éric Zemmour"}
  TONDELIER: {name: "Marine Tondelier"}
  ROUSSEL: {name: "Fabien Roussel"}
  DUPONT_AIGNAN: {name: "Nicolas Dupont-Aignan"}
  ARTHAUD: {name: "Nathalie Arthaud"}
  RUFFIN: {name: "François Ruffin"}
  HOLLANDE: {name: "François Hollande"}
  FAURE: {name: "Olivier Faure"}
  VILLEPIN: {name: "Dominique de Villepin"}
  LISNARD: {name: "David Lisnard"}
  BOUAMRANE: {name: "Karim Bouamrane"}
  POLONY: {name: "Natacha Polony"}

first_round:
  tables:
    # Měsíční tabulky v sekci "First round"; scénářové průzkumy (re-run 2022 apod.) vynecháme.
    - heading: ["First round"]
      exclude_heading: ["Scenario polling"]
  columns:
    pollster: "Polling firm"
    fieldwork: "Fieldwork date"
    sample_size: "Sample size"
  # Průzkumy obsahují více hypotetických sestav kandidátů na řádek.
  # Bereme jen řádky, kde kandidují všichni z "require" a nikdo z "exclude".
  # Základní scénář: Philippe jako jediný kandidát středu (bez Attala).
  scenario:
    require: [LE_PEN, PHILIPPE, MELENCHON, RETAILLEAU, GLUCKSMANN]
    exclude: [ATTAL, BARDELLA, HOLLANDE, FAURE, RUFFIN, VILLEPIN, LISNARD, BOUAMRANE]

runoff:
  tables:
    - heading: ["Second round"]
      exclude_heading: ["Declined to be candidates", "Scenario polling"]

# Volitelné přepsání parametrů modelu jen pro tyto volby, např.:
# model:
#   half_life_days: 21
