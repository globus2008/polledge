# French presidential election 2027 (first round 18 April 2027, runoff two weeks later)
id: fr_pres_2027
name: "Francie – prezidentské volby 2027"
type: two_round
election_date: 2027-04-18
wiki_page: "Opinion polling for the 2027 French presidential election"
default_sample_size: 1000

# Candidates: id -> name and aliases as they appear in table headers.
# The surname (name without the first word) is added as an alias automatically.
# Candidates not listed here are summed into "Others".
candidates:
  LE_PEN: {name: "Marine Le Pen", party: RN}
  BARDELLA: {name: "Jordan Bardella", party: RN}
  PHILIPPE: {name: "Édouard Philippe"}
  ATTAL: {name: "Gabriel Attal"}
  MELENCHON: {name: "Jean-Luc Mélenchon"}
  GLUCKSMANN: {name: "Raphaël Glucksmann"}
  RETAILLEAU: {name: "Bruno Retailleau"}
  ZEMMOUR: {name: "Éric Zemmour"}
  TONDELIER: {name: "Marine Tondelier"}
  ROUSSEL: {name: "Fabien Roussel"}
  DUPONT_AIGNAN: {name: "Nicolas Dupont-Aignan"}
  ARTHAUD: {name: "Nathalie Arthaud"}
  RUFFIN: {name: "François Ruffin"}
  HOLLANDE: {name: "François Hollande"}
  FAURE: {name: "Olivier Faure"}
  VILLEPIN: {name: "Dominique de Villepin"}
  LISNARD: {name: "David Lisnard"}
  BOUAMRANE: {name: "Karim Bouamrane"}
  POLONY: {name: "Natacha Polony"}

first_round:
  tables:
    # Monthly tables in the "First round" section; scenario polls (2022 re-run etc.) are skipped.
    - heading: ["First round"]
      exclude_heading: ["Scenario polling"]
  columns:
    pollster: "Polling firm"
    fieldwork: "Fieldwork date"
    sample_size: "Sample size"
  # Polls contain several hypothetical candidate line-ups, one per row. Each scenario keeps the rows
  # where everyone in "require" runs and nobody in "exclude" runs; the model mixes the scenarios by
  # weight. The weights are a judgement - adjust them as candidacies become clearer.
  scenarios:
    - name: philippe              # Philippe the only centrist, Retailleau for LR
      weight: 0.55
      require: [LE_PEN, PHILIPPE, MELENCHON, GLUCKSMANN, RETAILLEAU]
      exclude: [ATTAL, BARDELLA, LISNARD, HOLLANDE, FAURE, RUFFIN, VILLEPIN, BOUAMRANE]
    - name: philippe_attal        # Philippe and Attal both run
      weight: 0.20
      require: [LE_PEN, PHILIPPE, ATTAL, MELENCHON, GLUCKSMANN]
      exclude: [BARDELLA, LISNARD, HOLLANDE, FAURE, RUFFIN, VILLEPIN, BOUAMRANE]
    - name: lisnard               # Lisnard runs (Polymarket gives him a real chance)
      weight: 0.25
      require: [LE_PEN, PHILIPPE, LISNARD, MELENCHON]
      exclude: [ATTAL, BARDELLA, HOLLANDE, FAURE, RUFFIN, VILLEPIN]

runoff:
  tables:
    # Bardella head-to-head polls are kept: they matter if Le Pen cannot stand (see candidacy).
    - heading: ["Second round"]
      exclude_heading: ["Scenario polling"]

# Le Pen may not stand (ineligibility ruling): then Bardella runs and keeps most of her votes.
# The probability is updated every hour from the Polymarket "who will be on the ballot?" market.
candidacy:
  LE_PEN: {probability: 0.9, substitute: BARDELLA, transfer: 0.95}
candidacy_market: "2027-french-presidential-election-who-will-be-on-the-ballot"

# Optional model parameter overrides for this election only, e.g.:
# model:
#   half_life_days: 21

# Odds sources. Betano does not list this election yet; the hourly run searches its politics page
# for a competition containing all keywords and starts downloading as soon as one appears.
# Polymarket is a prediction market used as a market reference only (no signals or stakes).
bookmakers:
  betano:
    discover: ["Francie", "prezident"]
    markets:
      "Vítěz": winner
  polymarket:
    pages: ["next-french-presidential-election"]
    markets:
      "next-french-presidential-election": winner
