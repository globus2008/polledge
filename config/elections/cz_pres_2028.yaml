# Czech presidential election 2028
# The first-round date is an estimate (constitution: January 2028 at the latest; Betano lists 28 Jan 2028,
# which matches the runoff).
id: cz_pres_2028
name: "Česko – prezidentské volby 2028"
type: two_round
election_date: 2028-01-14
# A separate "Opinion polling for ..." page does not exist yet; the polls are in the main article.
wiki_page: "2028 Czech presidential election"
default_sample_size: 1000   # the tables do not give sample sizes

candidates:
  PAVEL: {name: "Petr Pavel"}
  BABIS: {name: "Andrej Babiš"}
  EBEN: {name: "Marek Eben"}
  HAVLICEK: {name: "Karel Havlíček"}
  OKAMURA: {name: "Tomio Okamura"}
  NERUDOVA: {name: "Danuše Nerudová"}
  SCHILLEROVA: {name: "Alena Schillerová"}
  DRAHOS: {name: "Jiří Drahoš"}
  FISCHER: {name: "Pavel Fischer"}
  TUREK: {name: "Filip Turek"}
  VYSTRCIL: {name: "Miloš Vystrčil"}
  KALOUSEK: {name: "Miroslav Kalousek"}
  KLAUS: {name: "Václav Klaus"}
  FIALA: {name: "Petr Fiala"}
  RAKUSAN: {name: "Vít Rakušan"}
  KUBA: {name: "Martin Kuba"}
  NEMCOVA: {name: "Miroslava Němcová"}
  VASUT: {name: "Marek Vašut"}
  VONDRACEK: {name: "Radek Vondráček"}
  MACINKA: {name: "Petr Macinka"}
  ZEMAN: {name: "Miloš Zeman"}

first_round:
  tables:
    - heading: ["Opinion polls", "First round"]
  columns:
    pollster: "Agency"
    fieldwork: "Date"
    sample_size: null
  # NOTE: STEM/MARK polls ask "who could you vote for" (several answers, rows sum to ~150 %).
  # The model rescales rows to 100 %, so this is only a rough estimate of relative support.
  row_total: [85, 200]
  scenario:
    require: [PAVEL, BABIS, HAVLICEK, EBEN]

runoff:
  tables:
    - heading: ["Opinion polls", "Second round"]
  columns:
    pollster: "Agency"
    fieldwork: "Date"
    sample_size: null

# Few polls -> longer half-life so the average does not rest on a single number.
model:
  half_life_days: 30
  max_poll_age_days: 540

# Where the bookmaker lists this election (public offer pages) and what its markets are called.
bookmakers:
  betano:
    pages:
      - "https://www.betano.cz/zapas-sance/ceske-prezidentske-volby-2028/31772398/"
    markets:
      "Vítěz": winner
