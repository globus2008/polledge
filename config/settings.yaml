# Global PollEdge settings. Paths are relative to the project root.
language: cs                # output language: cs | en (--help follows the POLLEDGE_LANG env variable)
database: data/polledge.db
cache_dir: data/cache
log_dir: logs
elections_dir: config/elections
calibrated_file: config/calibrated.yaml   # written by `polledge calibrate`; overrides "model" below

wikipedia:
  api_url: "https://en.wikipedia.org/w/api.php"
  # Wikipedia requires an identifiable User-Agent; add a contact (website or e-mail).
  user_agent: "PollEdge/0.1 (personal election-poll research; contact: https://github.com/globus2008)"
  cache_ttl_hours: 6        # a downloaded page is not fetched again before this time
  timeout_seconds: 20
  max_retries: 3

model:
  half_life_days: 14        # half-life of the poll weight by age
  max_poll_age_days: 180    # older polls are ignored
  house_effects: true
  house_min_polls: 3        # minimum polls of a pollster for a house-effect correction
  house_shrinkage: 0        # m in k/(k+m); 0 = no shrinkage
  sigma_sys_pp: 2.5         # systematic poll error per party (pp)
  sigma_horizon_pp_per_sqrt_day: 0.0   # extra uncertainty b*sqrt(days to election)
  sigma_runoff_pp: 3.0      # error of runoff head-to-head polls
  sigma_runoff_fallback_pp: 6.0  # when a pair has no head-to-head polls
  small_party_ref_pct: 10   # below this share the systematic error shrinks ~ sqrt(share/10 %)
  n_simulations: 10000
  seed: null                # a number = reproducible results
  min_share_pct: 0.1

scraping:                   # downloading odds from public bookmaker pages (fetch-odds, watch)
  user_agent: "Mozilla/5.0 (compatible; PollEdge/0.2; personal odds research)"
  cache_ttl_minutes: 30     # a page is not fetched again before this time
  min_delay_seconds: 5      # delay between requests to one host (a longer robots.txt Crawl-delay wins)
  timeout_seconds: 20
  max_retries: 2
  respect_robots_txt: true

notify:                     # where `watch` sends new signals
  channels: [console]       # console, email
  email:
    smtp_host: ""           # e.g. smtp.seznam.cz
    smtp_port: 587
    use_tls: true
    username: ""
    password_env: POLLEDGE_SMTP_PASSWORD   # the password is read from this env variable, never from a file
    sender: ""
    recipients: []

ai:                         # "AI review" button on the Signals page (second opinion on a signal)
  provider: openai          # openai | anthropic - default when both API keys are set (switchable in the app)
  openai_model: gpt-5.5
  anthropic_model: claude-opus-5-5
  max_searches: 5           # web searches per review
  # API keys: OPENAI_API_KEY / ANTHROPIC_API_KEY in Streamlit secrets or the environment, never here.

signals:
  edge_threshold: 0.05      # signal when edge > 5 %
  kelly_fraction: 0.25      # 1/4 Kelly
  bankroll: 10000           # virtual bankroll
  max_stake_pct: 0.05       # stake cap as a share of the bankroll (null = no cap)
  min_stake: 50             # no signal below this recommended stake (filters tiny long-shot bets)
  model_weight: 0.5         # where a reference market exists (Polymarket), edge and stake use the logit average:
                            # model_weight * model + (1 - model_weight) * market; 1 = model only
  currency: "Kč"            # currency label in the output only
