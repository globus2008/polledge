# Globální nastavení PollEdge. Cesty jsou relativní ke kořeni projektu.
database: data/polledge.db
cache_dir: data/cache
log_dir: logs
elections_dir: config/elections
calibrated_file: config/calibrated.yaml   # vytvoří příkaz `polledge calibrate`; má přednost před "model" níže

wikipedia:
  api_url: "https://en.wikipedia.org/w/api.php"
  # Wikipedie vyžaduje identifikovatelný User-Agent; doplň kontakt (web nebo e-mail).
  user_agent: "PollEdge/0.1 (personal election-poll research; contact: https://github.com/globus2008/polledgeCHANGE-ME"
  cache_ttl_hours: 6        # stažená stránka se znovu nestahuje dřív než po této době
  timeout_seconds: 20
  max_retries: 3

model:
  half_life_days: 14        # poločas váhy průzkumu podle stáří
  max_poll_age_days: 180    # starší průzkumy se ignorují
  house_effects: true
  house_min_polls: 3        # minimum průzkumů agentury pro korekci house effectu
  house_shrinkage: 0        # m v k/(k+m); 0 = bez shrinkage
  sigma_sys_pp: 2.5         # systematická chyba průzkumů na stranu (p.b.)
  sigma_horizon_pp_per_sqrt_day: 0.0   # přidaná nejistota b*sqrt(dní do voleb)
  sigma_runoff_pp: 3.0      # chyba head-to-head průzkumů 2. kola
  sigma_runoff_fallback_pp: 6.0  # když pro dvojici chybí H2H průzkumy
  small_party_ref_pct: 10   # pod touto hranicí se systematická chyba zmenšuje ~ sqrt(podíl/10 %)
  n_simulations: 10000
  seed: null                # číslo = reprodukovatelné výsledky
  min_share_pct: 0.1

signals:
  edge_threshold: 0.05      # signál při edge > 5 %
  kelly_fraction: 0.25      # 1/4 Kelly
  bankroll: 10000           # virtuální bankroll
  max_stake_pct: 0.05       # strop vkladu jako podíl bankrollu (null = bez stropu)
  currency: "Kč"
