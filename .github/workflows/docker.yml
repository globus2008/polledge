# Builds the monitoring container for amd64 and arm64 (Synology NAS models) and publishes it
# to GitHub Container Registry as ghcr.io/<owner>/polledge:latest.
name: docker

on:
  push:
    branches: [main]
    paths: ["src/**", "config/**", "pyproject.toml", "Dockerfile", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/polledge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
